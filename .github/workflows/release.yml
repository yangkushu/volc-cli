name: release

# tag 推送自动构建 win/linux x64 并发布 Release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write      # 上传 Release 资产所需

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: windows
            goarch: amd64
            ext: ".exe"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" -o "dist/volc-cli-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" .
      - name: Upload binaries
        uses: softprops/action-gh-release@v2
        with:
          # 每个 matrix 腿只上传本腿产物; action 按 tag 幂等, 两腿都指向同一 release
          files: "dist/volc-cli-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          generate_release_notes: true
          fail_on_unmatched_files: true
